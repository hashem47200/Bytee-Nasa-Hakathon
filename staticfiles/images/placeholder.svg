  <text x="400" y="320" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="700" font-size="20" fill="#ffffff" letter-spacing="3">NASA EXPLORER HUB</text>
  <text x="400" y="348" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#88a2ce" letter-spacing="1">TELEMETRY &amp; MISSION RECONNAISSANCE</text>
