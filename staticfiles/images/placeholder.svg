      <stop offset="0%" stop-color="#12254e"/>
      <stop offset="50%" stop-color="#0a142c"/>
      <stop offset="100%" stop-color="#030611"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38e1ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#spaceGrad)"/>
  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="90" r="1.5"/><circle cx="210" cy="60" r="1"/><circle cx="340" cy="110" r="2"/>
    <circle cx="520" cy="70" r="1.5"/><circle cx="680" cy="120" r="1"/><circle cx="740" cy="40" r="1.5"/>
    <circle cx="120" cy="380" r="1"/><circle cx="250" cy="420" r="2"/><circle cx="430" cy="390" r="1.5"/>
    <circle cx="610" cy="440" r="1"/><circle cx="710" cy="360" r="1.5"/>
